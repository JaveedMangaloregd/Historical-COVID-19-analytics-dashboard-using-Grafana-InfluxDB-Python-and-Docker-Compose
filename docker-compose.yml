
services:
  influxdb:
    image: influxdb:1.8.10
    container_name: covid-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: covid19
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana-oss:latest
    container_name: covid-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influxdb_data:
  grafana_data:

  
#services defines the applications Docker will run.
#influxdb starts the database.
#grafana starts the visualization server.
#ports maps Windows localhost ports to container ports.
#volumes preserves database and dashboard data when containers restart.
#depends_on starts the InfluxDB container before Grafana; it does not guarantee that the database is already ready to accept connections.